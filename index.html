<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steal-a-Noob 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#55b9f4;font-family:Arial,sans-serif}
#hud{position:fixed;z-index:2;top:12px;left:12px;color:white;text-shadow:2px 2px 3px #222;font-weight:bold;pointer-events:none}
#title{font-size:clamp(22px,4vw,38px);color:#ffe84a;-webkit-text-stroke:1px #774000}
#stats{font-size:16px;line-height:1.7}
#tip{position:fixed;z-index:2;bottom:14px;left:50%;transform:translateX(-50%);background:#111c;color:#fff;padding:10px 14px;border:2px solid #fff;border-radius:12px;text-align:center;max-width:95%;font-size:14px}
#run{position:fixed;z-index:2;top:12px;left:50%;transform:translateX(-50%);background:#c90000;color:#fff;border:3px solid #ff6d6d;border-radius:15px;padding:5px 32px;font-size:clamp(20px,3vw,32px);font-weight:1000;display:none}
#message{position:fixed;z-index:3;top:22%;left:50%;transform:translateX(-50%);background:#111d;color:#fff;padding:10px 18px;border-radius:12px;font-weight:bold;display:none;text-align:center}
#controls{position:fixed;right:12px;bottom:75px;z-index:2;display:flex;flex-direction:column;gap:6px}
#controls button{width:52px;height:45px;border:2px solid white;border-radius:10px;background:#193eaecc;color:white;font-size:20px;font-weight:bold}
</style>
</head>
<body>
<div id="hud"><div id="title">STEAL-A-NOOB!</div><div id="stats">Cash: $0<br> Noobs: 0<br>Income: $0/s<br>Shift: DAY</div></div>
<div id="run">RUN!!</div><div id="message"></div>
<div id="tip">WASD / Arrow keys = move · E = steal / place · Reach the GREEN SAFE ZONE to escape!</div>
<div id="controls"><button data-k="ArrowUp">▲</button><div><button data-k="ArrowLeft">◀</button> <button data-k="ArrowDown">▼</button> <button data-k="ArrowRight">▶</button></div><button id="action">E · STEAL</button></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=> {
const stats=document.querySelector('#stats'),run=document.querySelector('#run'),message=document.querySelector('#message');
if(!window.THREE){message.style.display='block';message.textContent='3D engine did not load. Please check your internet connection.';return;}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x56c3fa);scene.fog=new THREE.Fog(0x56c3fa,90,240);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,400);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x65874c,2));const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(-20,40,25);sun.castShadow=true;scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.85});
const grass=mat(0x67e52b),wallmat=mat(0xc77e5f),pathmat=mat(0xece8f6),fencemat=mat(0x9a5228),dark=mat(0x343d4b),skin=mat(0xffc58c),shirt=mat(0x38a9f2),pants=mat(0x243a7c),hair=mat(0x7b4928),hair2=mat(0x57301f),white=mat(0xffffff),green=mat(0x00fa53),gold=mat(0xffd21f);
function box(parent,x,y,z,sx,sy,sz,m){const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function floor(x,z,sx,sz,m){return box(scene,x,-.35,z,sx,.7,sz,m)}
floor(0,0,30,250,grass);
// Long, straight corridor with tall checker-like walls.
box(scene,-15,5,0,1,11,250,wallmat);box(scene,15,5,0,1,11,250,wallmat);
box(scene,0,10,-125,31,1,1,green);
for(let z=-120;z<125;z+=12){box(scene,-15,5,z,1,11,.25,mat(0xb86f55));box(scene,15,5,z,1,11,.25,mat(0xb86f55));}
// straight central path
floor(0,-47,11,150,pathmat);
// starting safe zone at one end
floor(0,87,27,25,green);
box(scene,0,.1,87,12,.1,12,mat(0x20bd4a));
function makeNoob(x,z,scale=1,variant=0){
 const g=new THREE.Group();scene.add(g);g.position.set(x,0,z);g.scale.setScalar(scale);
 const colors=[shirt,mat(0x8b5cf6),mat(0x14b8a6),mat(0xff9b35),mat(0xff66ad)];
 box(g,0,1.25,0,.9,1,.5,colors[variant%colors.length]);box(g,0,2.05,0,.75,.72,.65,skin);
 // classic bacon hair: multiple brown wavy-looking layered strips on top and sides
 box(g,0,2.48,0,.84,.22,.72,hair);
 for(let i=0;i<5;i++){let strand=box(g,-.32+i*.16,2.61-(i%2)*.07,-.03,.13,.38,.76,i%2?hair:hair2);strand.rotation.z=(i-2)*-.13;strand.rotation.x=.15;}
 box(g,-.42,2.32,-.02,.16,.48,.6,hair2);box(g,.42,2.32,-.02,.16,.48,.6,hair);
 box(g,-.17,2.1,.33,.08,.1,.04,dark);box(g,.17,2.1,.33,.08,.1,.04,dark);box(g,0,1.96,.34,.2,.05,.04,dark);
 box(g,-.25,.5,0,.28,.65,.32,pants);box(g,.25,.5,0,.28,.65,.32,pants);box(g,-.25,.13,.08,.35,.18,.5,dark);box(g,.25,.13,.08,.35,.18,.5,dark);
 return g;
}
function guardian(x,z,name,color,speed){const g=new THREE.Group();scene.add(g);g.position.set(x,0,z);box(g,0,1.5,0,1.5,2.5,1.1,mat(color));box(g,0,3,0,1.25,1.1,1.1,skin);box(g,0,3.45,0,1.3,.3,1.15,mat(0x303030));box(g,-.25,3,.57,.12,.12,.06,mat(0x111111));box(g,.25,3,.57,.12,.12,.06,mat(0x111111));g.userData={name,speed,homeZ:z};return g;}
const noobs=[];for(let i=0;i<9;i++){const z=58-i*13;noobs.push({mesh:makeNoob((i%2?2:-2),z,.82,i),stolen:false,value:10*(i+1)});}
const guardians=[guardian(-3,30,'DON’T-CARE PARENT',0x6b82b4,.075),guardian(3,-18,'FAT GYM TEACHER',0x5a7c42,.095),guardian(0,-75,'HALL MONITOR',0x6b3232,.11)];
// pen stalls all in a single straight row alongside the corridor
for(let i=0;i<8;i++){const z=72-i*12;box(scene,9,.3,z,5,.4,7,mat(0xb6f6ff));box(scene,6.5,1,z, .18,1.5,7,fencemat);box(scene,11.5,1,z,.18,1.5,7,fencemat);box(scene,9,1,z-3.5,5,1.5,.18,fencemat);box(scene,9,1,z+3.5,5,1.5,.18,fencemat);}
// simple shop pads in line at far end
for(let i=0;i<3;i++){const z=-95-i*9;box(scene,-7,.15,z,3,.3,3,[gold,mat(0xb56cff),mat(0x4ee8ff)][i]);}
const player=new THREE.Group();scene.add(player);player.position.set(0,0,96);
box(player,0,1.2,0,.8,1,.5,shirt);box(player,0,2,0,.7,.7,.65,skin);box(player,0,2.4,0,.8,.22,.7,hair);for(let i=0;i<5;i++)box(player,-.3+i*.15,2.55-(i%2)*.08,0,.13,.35,.7,i%2?hair:hair2);box(player,-.2,2,.34,.08,.1,.04,dark);box(player,.2,2,.34,.08,.1,.04,dark);box(player,-.22,.45,0,.25,.6,.3,pants);box(player,.22,.45,0,.25,.6,.3,pants);
let cash=0,owned=0,rate=0,bag=null,chasing=null,upgrade=0,shift='DAY',lastShift=performance.now(),msgTimer=0;
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')interact();});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',()=>keys[k.toLowerCase()]=true);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k.toLowerCase()]=false));});
document.querySelector('#action').addEventListener('click',interact);
function say(t){message.textContent=t;message.style.display='block';msgTimer=2.3;}
function safe(){return player.position.z>75;}
function interact(){
 if(bag){if(!safe()){say('RUN to the GREEN SAFE ZONE!');return;}bag.stolen=false;bag.mesh.visible=true;bag.mesh.position.set(9,0,player.position.z-5);owned++;rate+=bag.value;bag=null;chasing=null;say('Noob added to your straight-row pen!');return;}
 let best=null,dist=6;for(const n of noobs){if(n.stolen)continue;const d=player.position.distanceTo(n.mesh.position);if(d<dist){best=n;dist=d;}}
 if(best){best.stolen=true;best.mesh.visible=false;bag=best;chasing=guardians.reduce((a,g)=>Math.abs(g.position.z-player.position.z)<Math.abs(a.position.z-player.position.z)?g:a,guardians[0]);run.style.display='block';say('YOU STOLE A NOOB! RUN!!');}
 else if(player.position.x>5&&player.position.z>25){upgrade++;cash-=Math.min(cash,100*upgrade);say('Pen upgraded!');}
 else say('Get close to a bacon-haired Noob and press E!');
}
function updateStats(){stats.innerHTML=`Cash: $${Math.floor(cash).toLocaleString()}<br>Noobs: ${owned}<br>Income: $${rate}/s<br>Shift: ${shift}<br>Pen level: ${upgrade+1}`;}
let prev=performance.now();
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-prev)/16.67,2);prev=now;cash+=rate*dt/60;
 if(now-lastShift>45000){shift=shift==='DAY'?'NIGHT':'DAY';lastShift=now;say(shift+' SHIFT!');scene.background=new THREE.Color(shift==='DAY'?0x56c3fa:0x17284f);}
 let dx=0,dz=0;if(keys.w||keys.arrowup)dz-=1;if(keys.s||keys.arrowdown)dz+=1;if(keys.a||keys.arrowleft)dx-=1;if(keys.d||keys.arrowright)dx+=1;
 const len=Math.hypot(dx,dz)||1;player.position.x+=dx/len*.24*dt;player.position.z+=dz/len*.24*dt;player.position.x=THREE.MathUtils.clamp(player.position.x,-12,12);player.position.z=THREE.MathUtils.clamp(player.position.z,-118,105);
 if(bag&&chasing){if(safe()){chasing=null;bag=null;/* picked Noob escapes automatically at safe zone */owned++;rate+=10;run.style.display='none';say('Escaped! Noob safely added to your pen!');}else{chasing.position.z+=(player.position.z-chasing.position.z)*.018*dt;chasing.position.x+=(player.position.x-chasing.position.x)*.018*dt;if(Math.abs(chasing.position.z-player.position.z)<1.7){bag.stolen=false;bag.mesh.visible=true;bag.mesh.position.set(0,0,player.position.z-2);bag=null;chasing=null;run.style.display='none';say('Caught! Try stealing again.');}}}
 if(!bag)run.style.display='none';if(msgTimer>0){msgTimer-=dt/60;if(msgTimer<=0)message.style.display='none';}
 for(const g of guardians){if(g!==chasing){g.position.z=g.userData.homeZ+Math.sin(now*.0007+g.position.x)*.5;}}
 // third-person follow camera, looking down the long straight lane
 const target=new THREE.Vector3(player.position.x,1.3,player.position.z);
 camera.position.lerp(new THREE.Vector3(player.position.x,9,player.position.z+12),.09);camera.lookAt(target);
 // Face movement direction
 if(Math.abs(dx)+Math.abs(dz)>.1)player.rotation.y=Math.atan2(dx,dz);
 updateStats();renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
updateStats();animate(performance.now());
})();
</script>
</body>
</html>
